name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FlowLint
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest -v

      - name: Lint the bundled fixtures (expected to fail — that's the demo)
        run: flowlint fixtures/ --format table
        continue-on-error: true

  # Example of how a real consuming repo would gate merges on FlowLint. Point
  # `flowlint` at your own force-app/**/flows directory and drop continue-on-error.
  lint-flows-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flowlint
      - run: flowlint force-app/main/default/flows/ --format table
